# Local development only. Render builds its own image from the Dockerfile and
# does not read this file.
#
#   docker compose up --build      start the API on http://localhost:8080
#   docker compose up postgres     start only the database (for ./mvnw spring-boot:run)
#   docker compose down            stop and remove containers
#
# Values are overridable via a gitignored .env file; see .env.example.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: zarlania-api:local
    container_name: zarlania-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      # In-network address; the host-published port below is for spring-boot:run.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-zarlania}
      DB_USER: ${DB_USER:-zarlania}
      DB_PASSWORD: ${DB_PASSWORD:-zarlania}
      # Unlike application.yml's own default (true, for every non-local environment),
      # this container is served over plain http://localhost, so the default here is
      # false — a Secure cookie would never come back from a browser talking http.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Empty by default: JwtKeys and EmailConfig fall back to an ephemeral dev
      # keypair and a logging-only email sender when these are unset outside the
      # production profile (SPRING_PROFILES_ACTIVE above defaults to local). Set
      # them in .env only to exercise a real key or Resend send from this container.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_RETIRED_PUBLIC_KEYS: ${JWT_RETIRED_PUBLIC_KEYS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@zarlania.com}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.zarlania.com}
      APP_BASE_URL: ${APP_BASE_URL:-https://zarlania.com}
      ZARLANIA_CORS_ALLOWED_ORIGINS: ${ZARLANIA_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgres:
    # Same major version render.yaml pins for production and the smoke test uses.
    image: postgres:17-alpine
    container_name: zarlania-postgres
    ports:
      # Bound to loopback: an omitted host IP binds to 0.0.0.0, which would
      # publish the default credentials below to the whole local network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-zarlania}
      POSTGRES_USER: ${DB_USER:-zarlania}
      # Harmless dev-only default; the port binding above keeps this off the network.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zarlania}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
