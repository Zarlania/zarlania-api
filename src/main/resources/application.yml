spring:
  application:
    name: zarlania-api
  # Composed from parts, not one URL: Render blueprints can inject a database's
  # host/port/database/user/password into env vars but cannot template them into
  # a JDBC URL (Render's own connectionString is postgres://, which JDBC rejects).
  # Any Postgres provider plugs in through these five variables.
  datasource:
    # stringtype=unspecified: without it, pgjdbc binds a String parameter as
    # varchar, so Postgres resolves `citext_column = ?` via an implicit cast to
    # plain text on both sides and silently compares case-sensitively — the
    # unique/case-insensitive columns CLAUDE.md documents (email, username)
    # would stop matching on case. Leaving the type unspecified lets Postgres
    # infer it from the citext column instead.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zarlania}?stringtype=unspecified
    username: ${DB_USER:zarlania}
    password: ${DB_PASSWORD:zarlania}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it,
      # so drift fails startup instead of silently diverging.
      ddl-auto: validate
    # The default (true) holds the session open into the web layer, letting lazy
    # loads leak entities across domain boundaries.
    open-in-view: false

server:
  # Render injects PORT; 8080 is the local default.
  port: ${PORT:8080}
  tomcat:
    threads:
      # Tomcat's default is 200. Each request thread that reaches the password hasher can hold a
      # 19 MiB Argon2 buffer on a ~358 MB heap, so the default is enough concurrency to OOM-kill
      # the instance on its own. CredentialsService's semaphore is what actually caps live
      # buffers; this caps how many requests can be queued behind it before Tomcat starts
      # refusing connections, which is the failure mode we want instead of an OOM.
      max: 50
  # Deliberately `none`, even though this service does sit behind Render's proxy. `framework`
  # would make Spring's ForwardedHeaderFilter rewrite getRemoteAddr() from the *leftmost*
  # X-Forwarded-For entry (and from a client-supplied Forwarded: header in preference to it).
  # Proxies append to X-Forwarded-For rather than replace it, so the leftmost entry is whatever
  # the client sent: any unauthenticated caller could rotate it and get a fresh throttle bucket
  # per request. Transiting Render's proxy does not prevent that — only replacement at the proxy
  # would, and Render appends.
  #
  # The rightmost entry is the one Render itself wrote, so that is the trustworthy one, and
  # ClientIpResolver (common/http) reads it directly — which it can only do while these headers
  # are left intact, i.e. while this stays `none`.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is public. Add endpoints deliberately —
        # everything exposed here is reachable without authentication today.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# CORS: SecurityConfig's corsConfigurationSource bean reads allowed-origins below.
zarlania:
  cors:
    allowed-origins: ${ZARLANIA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    from: ${EMAIL_FROM:no-reply@zarlania.com}
    resend-api-key: ${RESEND_API_KEY:}
  auth:
    issuer: ${JWT_ISSUER:https://api.zarlania.com}
    access-token-ttl: PT15M
    refresh-family-lifetime: P30D
    unverified-account-max-age: P7D
    cleanup-interval: PT1H
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    jwt-private-key-pem: ${JWT_PRIVATE_KEY:}
    jwt-retired-public-keys-pem: ${JWT_RETIRED_PUBLIC_KEYS:}
    app-base-url: ${APP_BASE_URL:https://zarlania.com}
  # Owned by the credentials domain, not by auth: EmailVerificationService binds these, and a
  # credentials class reading zarlania.auth.* would invert the domains' dependency direction.
  credentials:
    verification-token-ttl: PT24H
    # Argon2id holds 19 MiB on the Java heap per hash in flight (see
    # CredentialsService#hash). Four at once is ~76 MiB of the free tier's ~358 MB heap,
    # which leaves room for everything else the request is doing; raise it only alongside
    # a bigger instance.
    max-concurrent-hashes: 4
  throttle:
    window: PT1M
    login-limit: 10
    register-limit: 5
    resend-limit: 3
    refresh-limit: 30
