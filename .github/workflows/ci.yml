name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch; the newest commit is the only one
# whose result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to post the coverage comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # `verify` runs the tests plus the Spotless, Checkstyle, SpotBugs and
      # JaCoCo checks bound to that phase (and the enforcer rules at `validate`),
      # so formatting, style, bug and coverage violations all fail the build here.
      - name: Build, test, check formatting and coverage
        run: ./mvnw -B -ntp verify

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        # Pull requests from forks get a read-only token, so the comment cannot be
        # posted there. The coverage gate itself already ran in the step above —
        # this is reporting only, and must not fail the build.
        continue-on-error: true
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # The reference docs tooling is a Python package with its own test suite and
  # coverage gate. Formatting and lint for it run in the Lint workflow; what is
  # here is the build-and-test half.
  docs-tooling:
    name: Reference docs tooling tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are needed only for the coverage report on same-repo pull requests:
      # cobertura-action publishes it as a check run, not just a comment, and
      # without `checks: write` it fails with "Resource not accessible by
      # integration".
      pull-requests: write
      checks: write
    defaults:
      run:
        working-directory: docs/tooling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job installs and runs repository-controlled Python; keep the
          # GitHub token out of .git/config so that code cannot read it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install -e '.[dev]'

      - name: Type-check
        run: mypy

      # The 80% line-and-branch gate is in pyproject.toml, so this step is what
      # fails the build; the comment below is reporting only.
      - name: Reference docs tooling tests
        run: pytest --cov-report=xml

      # Only same-repo pull requests get a writable token — fork and Dependabot
      # runs are read-only, and posting from them would fail a step over a
      # comment that is not worth failing for.
      - name: Python coverage report comment
        if: >-
          ${{ !cancelled() &&
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('docs/tooling/coverage.xml') != '' }}
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
        with:
          # Paths for an action are workspace-relative; `working-directory`
          # above only applies to `run:` steps.
          path: docs/tooling/coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 80
          fail_below_threshold: false
          # Report all measured modules, not only changed files: the action paginates
          # changed files at 30/page (omitting Python files on later pages of large PRs),
          # and the module set here is small — a full table is both correct and readable.
          only_changed_files: false
          show_branch: true
          report_name: Python Coverage

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required for the GitHub Actions cache backend below: the default docker
      # driver cannot export a build cache, only the docker-container driver
      # this sets up can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build only — this proves the Dockerfile is valid without publishing
      # anything. Render builds its own image on deploy.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: false
          tags: zarlania-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
