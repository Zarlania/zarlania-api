version: 2

updates:
  # ----- Java / Maven -----
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Spring releases its modules in lockstep, so a split across PRs would
      # produce combinations that were never tested together.
      spring:
        patterns:
          - "org.springframework*:*"
          - "io.micrometer:*"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "org.junit*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
        update-types:
          - minor
          - patch
      build-plugins:
        patterns:
          - "*maven-plugin*"
          - "com.diffplug.spotless:*"
          - "com.google.googlejavaformat:*"
        update-types:
          - minor
          - patch
      # Everything else that is not a major bump, so routine upkeep is one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ----- Python / reference docs tooling -----
  # docs/tooling is a self-contained package with its own pinned dependencies.
  # Nothing in the Maven build reaches it, so it needs an entry of its own or it
  # never gets updated at all.
  - package-ecosystem: pip
    directory: "/docs/tooling"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # These two groups include major, because a split major cannot install: a
      # stub package's version tracks the library it describes, and pytest-cov
      # caps its pytest peer.
      pyyaml:
        patterns:
          - "pyyaml"
          - "types-PyYAML"
        update-types:
          - minor
          - patch
          - major
      pytest:
        patterns:
          - "pytest"
          - "pytest-cov"
        update-types:
          - minor
          - patch
          - major
      # ruff and mypy have no lockstep sibling. Kept to minor and patch so a
      # major — which is where both tools turn on new diagnostics — arrives as
      # its own PR rather than bundled with unrelated bumps.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ----- GitHub Actions -----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ----- Docker base images -----
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
